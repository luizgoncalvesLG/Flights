name: Consulta de preços

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Recriar credenciais do Google
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          mkdir -p credentials
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials/google_service_account.json
          if [ ! -s credentials/google_service_account.json ]; then
            echo "::error::O secret GOOGLE_CREDENTIALS_JSON está vazio ou não foi configurado."
            exit 1
          fi
          python -c "import json; json.load(open('credentials/google_service_account.json'))" || {
            echo "::error::O conteúdo de GOOGLE_CREDENTIALS_JSON não é um JSON válido."
            exit 1
          }

      - name: Rodar consulta de preços
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          MOEDA: brl
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_CREDENTIALS_PATH: credentials/google_service_account.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python -m src.consulta_precos
